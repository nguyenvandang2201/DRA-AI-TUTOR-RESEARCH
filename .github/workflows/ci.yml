name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Kiem dinh du lieu (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Toan bo cong cu chi dung thu vien chuan, khong can buoc cai dat.
      - name: Kiem dinh schema va quy uoc dat ten
        run: python tools/validate_datasets.py --strict

      - name: Xac nhan split tai lap duoc
        run: python tools/make_splits.py --check

      - name: Xac nhan bao cao thong ke da cap nhat
        run: python tools/dataset_stats.py --check

      - name: Xac nhan file xuat da cap nhat
        run: python tools/export_dataset.py --check

      - name: Chay test
        run: python -m unittest discover -s tests -v

  reproducibility:
    name: Ket qua baseline va hinh ve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chay lai toan bo thi nghiem va so voi file da commit. Buoc nay se fail
      # neu ket qua trong kho khong con tai lap duoc tu du lieu nguon.
      - name: Xac nhan ket qua baseline con dung
        run: python tools/baseline_router.py --check

      - name: Xac nhan hinh ve con dung
        run: python tools/make_figures.py --check

      - name: Xac nhan cay lam viec sach sau khi sinh lai
        run: |
          python tools/make_splits.py
          python tools/dataset_stats.py
          python tools/export_dataset.py
          python tools/make_figures.py
          git diff --exit-code

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ruff la cong cu phat trien tuy chon, chi cai trong CI.
      - name: Cai cong cu phat trien
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Kiem tra lint
        run: python -m ruff check tools tests

  coverage:
    name: Do coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai cong cu phat trien
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Chay test kem do coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Luu bao cao HTML
        if: always()
        run: python -m coverage html
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore
