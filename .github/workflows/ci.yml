name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Kiem dinh du lieu (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Toan bo cong cu chi dung thu vien chuan, khong can buoc cai dat.
      - name: Kiem dinh schema va quy uoc dat ten
        run: python tools/validate_datasets.py --strict

      - name: Xac nhan split tai lap duoc
        run: python tools/make_splits.py --check

      - name: Xac nhan bao cao thong ke da cap nhat
        run: python tools/dataset_stats.py --check

      - name: Xac nhan file xuat da cap nhat
        run: python tools/export_dataset.py --check

      - name: Chay test
        run: python -m unittest discover -s tests -v

  baseline:
    name: Baseline dinh tuyen (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hold-out tren tap dev
        run: python tools/baseline_router.py --mode holdout --eval-split dev
