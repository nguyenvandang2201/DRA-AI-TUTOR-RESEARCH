  <text x="440.0" y="322.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">0.500</text>
  <line x1="432.0" y1="50" x2="432.0" y2="360" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
