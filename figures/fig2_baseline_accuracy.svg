  <text x="64" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#999999">150 truy vấn giữ riêng, cân bằng nhãn 75/75</text>
  <line x1="214.0" y1="56" x2="214.0" y2="356" stroke="#d8d8d8" stroke-width="1"/>
