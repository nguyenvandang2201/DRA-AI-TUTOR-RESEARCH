  <text x="202" y="97.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1a1a1a">TF-IDF + logistic</text>
  <rect x="214" y="76.5" width="424.4" height="34.0" fill="#009E73" rx="2"/>
  <text x="646.4" y="97.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">0.973</text>
  <text x="202" y="172.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1a1a1a">Ngưỡng độ dài ≥ 19</text>
  <rect x="214" y="151.5" width="395.3" height="34.0" fill="#0072B2" rx="2"/>
  <text x="617.3" y="172.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">0.907</text>
  <text x="202" y="247.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1a1a1a">Luật từ khoá</text>
  <rect x="214" y="226.5" width="386.6" height="34.0" fill="#0072B2" rx="2"/>
  <text x="608.6" y="247.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">0.887</text>
  <text x="202" y="322.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#1a1a1a">Đoán nhãn đa số</text>
