<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="So sánh baseline định tuyến trên tập test">
  <title>So sánh baseline định tuyến trên tập test</title>
  <rect width="720" height="420" fill="#ffffff"/>
